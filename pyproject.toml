[project]
name = "cs527-group18"
version = "0.1.0"
description = "Simple GNN baseline for predicting failing CI builds from project call graphs."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1.0",
    "torch>=2.4.0",
]

[project.scripts]
failure-gnn = "failure_gnn.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/failure_gnn"]
